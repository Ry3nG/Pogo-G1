[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[project]
name = "pogo-g1"
version = "0.1.0"
description = "Humanoid G1 learning to ride a passive pogo stick"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["mujoco~=3.15.0", "numpy>=2.0,<3", "scipy>=1.15,<2"]

[project.optional-dependencies]
train = ["mjlab==1.6.0", "torch==2.11.0", "warp-lang==1.18.0", "imageio>=2.37,<3", "trimesh>=5.1,<6"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
# mjlab 1.6.0 pins ~=3.11; newer MuJoCo Warp is faster for this contact-rich scene.
override-dependencies = ["mujoco==3.15.0", "mujoco-warp==3.15.0"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
